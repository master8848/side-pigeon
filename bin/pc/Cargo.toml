[package]
name = "pc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "side-pigeon sidecar binary: JSON-RPC 2.0 over stdio"

[[bin]]
name = "pc"
path = "src/main.rs"

[features]
# Built-in echo provider for local testing / demos (no network needed).
default = ["demo", "persist"]
demo = []
# Real providers are compile-time feature-gated (compile-time pruning, per
# docs/architecture.md §7.1.5). Wire a provider by enabling its feature AND
# listing it in the config's "providers" array.
telegram = ["dep:provider-telegram"]
discord = ["dep:provider-discord"]
# Optional transports for `pc serve` (lean sidecar stays stdio-only by default).
http = ["provider-transport/http"]
ws = ["provider-transport/ws"]
# Durable at-least-once log for `pc serve` (WAL sqlite). Opt-out with
# `--no-default-features` for a lean embed with no sqlite.
persist = ["provider-transport/persist"]

[dependencies]
provider-core = { path = "../../crates/provider-core" }
provider-transport = { path = "../../crates/provider-transport" }
provider-telegram = { path = "../../crates/provider-telegram", optional = true }
provider-discord = { path = "../../crates/provider-discord", optional = true }
provider-config = { path = "../../crates/provider-config" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
