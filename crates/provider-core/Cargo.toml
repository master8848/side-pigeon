[package]
name = "provider-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Unified schema, capability traits, error types (ported from ZeroClaw, MIT/Apache-2.0)"

[features]
default = ["registry"]
# The feature-gated provider registry. Disable for a lean embed that only
# needs schema + traits (e.g. provider crates themselves).
registry = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# Wire format: MediaAttachment.data is base64-encoded by the JSON-RPC layer
# (contract promise). base64 0.22.1 is already in the lockfile (transitive);
# making it a direct dep pins the wire codec. Published 2024-01-26 (>=14d).
base64 = "0.22" 

[dev-dependencies]
tokio = { workspace = true }
