[package]
name = "provider-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JSON-RPC 2.0 transports: stdio (primary), WebSocket and HTTP (feature-gated)"

[features]
default = ["stdio"]
# Primary transport: newline-delimited JSON-RPC 2.0 over stdio (ACP-style).
stdio = []
# Optional WebSocket server (tokio-tungstenite). Off by default.
ws = ["dep:tokio-tungstenite", "dep:futures-util"]
# Optional minimal HTTP/1.1 server (hand-rolled on hyper). Off by default.
http = ["dep:hyper", "dep:hyper-util", "dep:http-body-util"]

[dependencies]
provider-core = { path = "../provider-core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# --- optional transports -------------------------------------------------
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true }
hyper = { version = "1", default-features = false, features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }

[dev-dependencies]
async-trait = { workspace = true }
