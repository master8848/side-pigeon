[workspace]
resolver = "2"
members = [
  "crates/provider-core",
  "crates/provider-transport",
  "crates/provider-telegram",
  "crates/provider-discord",
  "bin/pc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lib-prj/provider-connect"
description = "Rust sidecar connecting AI agents to messaging providers with a language-agnostic JSON-RPC API"

[workspace.dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "io-std", "io-util", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.24"
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
